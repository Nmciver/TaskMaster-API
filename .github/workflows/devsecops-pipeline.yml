name: DevSecOps Security Delivery Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  software-supply-chain-analysis:
    name: Software Supply Chain Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Snyk Node dependency scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Python dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: "TaskMaster-API"
          path: "."
          format: "HTML"

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports


  dast-runtime-verification:
    name: DAST Runtime Verification
    needs: software-supply-chain-analysis
    if: always()
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          docker compose logs
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:8080"

      - name: Show container logs
        if: always()
        run: docker compose logs